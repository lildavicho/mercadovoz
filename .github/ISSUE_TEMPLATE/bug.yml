name: Bug
description: Report a reproducible product or engineering defect without private data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include participant text, credentials, database content or private URLs.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened? Use synthetic/redacted examples only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps, versions and synthetic input.
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Financial safety impact
      options: [None known, Possible, Confirmed critical]
    validations:
      required: true
