version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python-runtime:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      web-runtime:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
