[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mercadovoz-parser"
version = "0.1.0"
description = "Safe, auditable text-to-operation engine and private pilot for MercadoVoz"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1"]
test = ["httpx>=0.28,<1", "httpx2>=2,<3"]

[project.scripts]
mercadovoz = "mercadovoz.cli:main"
mercadovoz-core = "mercadovoz_core.cli:main"
mercadovoz-api = "mercadovoz_core.service:main"

[tool.setuptools]
package-dir = {"" = "engine/src"}

[tool.setuptools.packages.find]
where = ["engine/src"]
